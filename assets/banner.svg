<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="CMIP6 Downloader banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d4d"/>
      <stop offset="0.55" stop-color="#1b4fd8"/>
      <stop offset="1" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe082"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd54f"/>
      <stop offset="1" stop-color="#ff7043"/>
    </radialGradient>
    <clipPath id="globe"><circle cx="1010" cy="160" r="120"/></clipPath>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <!-- globe -->
  <circle cx="1010" cy="160" r="120" fill="#0d2a7a" opacity="0.55"/>
  <g clip-path="url(#globe)" fill="none" stroke="#9be7ff" stroke-opacity="0.55" stroke-width="1.6">
    <ellipse cx="1010" cy="160" rx="120" ry="40"/>
    <ellipse cx="1010" cy="160" rx="120" ry="80"/>
    <ellipse cx="1010" cy="160" rx="40" ry="120"/>
    <ellipse cx="1010" cy="160" rx="80" ry="120"/>
    <line x1="890" y1="160" x2="1130" y2="160"/>
    <line x1="1010" y1="40" x2="1010" y2="280"/>
  </g>
  <!-- bounding box on globe -->
  <rect x="1018" y="118" width="62" height="52" rx="4" fill="#ffd54f" fill-opacity="0.25" stroke="#ffd54f" stroke-width="3" stroke-dasharray="7 5"/>
  <circle cx="1018" cy="118" r="5" fill="#ffd54f"/><circle cx="1080" cy="170" r="5" fill="#ffd54f"/>
  <circle cx="1010" cy="160" r="120" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
  <!-- sun -->
  <circle cx="1120" cy="62" r="26" fill="url(#sun)"/>
  <!-- data waves -->
  <g fill="none" stroke-linecap="round">
    <path d="M0 262 C 150 220, 300 300, 450 255 S 700 215, 850 262" stroke="#ffffff" stroke-opacity="0.18" stroke-width="5"/>
    <path d="M0 285 C 160 245, 310 320, 470 280 S 720 240, 880 288" stroke="#ffffff" stroke-opacity="0.12" stroke-width="5"/>
  </g>
  <!-- text -->
  <text x="64" y="142" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="82" font-weight="800" fill="url(#title)" letter-spacing="2">CMIP6</text>
  <text x="64" y="212" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="8">DOWNLOADER</text>
  <text x="66" y="258" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" fill="#d6f3ff">Pick your variables. Draw your box. Download the climate.</text>
  <!-- variable chips -->
  <g font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <rect x="66"  y="40" width="52" height="28" rx="14" fill="#ffffff" fill-opacity="0.2"/><text x="92"  y="60" fill="#fff">tas</text>
    <rect x="126" y="40" width="52" height="28" rx="14" fill="#ffffff" fill-opacity="0.2"/><text x="152" y="60" fill="#fff">pr</text>
    <rect x="186" y="40" width="62" height="28" rx="14" fill="#ffffff" fill-opacity="0.2"/><text x="217" y="60" fill="#fff">psl</text>
    <rect x="256" y="40" width="72" height="28" rx="14" fill="#ffffff" fill-opacity="0.2"/><text x="292" y="60" fill="#fff">tasmax</text>
    <rect x="336" y="40" width="72" height="28" rx="14" fill="#ffffff" fill-opacity="0.2"/><text x="372" y="60" fill="#fff">tasmin</text>
    <rect x="416" y="40" width="56" height="28" rx="14" fill="#ffffff" fill-opacity="0.2"/><text x="444" y="60" fill="#fff">huss</text>
    <rect x="480" y="40" width="80" height="28" rx="14" fill="#ffffff" fill-opacity="0.2"/><text x="520" y="60" fill="#fff">sfcwind</text>
  </g>
</svg>
